<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>フォトフレームカメラ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      position: fixed;
      inset: 0;
      background: #000;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(1);
    }

    #camera.mirror {
      transform: scaleX(-1);
    }

    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 2;
    }

    .ui {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,.55));
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      color: #fff;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #switchBtn {
      width: 54px;
      height: 54px;
    }

    #shotBtn {
      width: 76px;
      height: 76px;
      background: #fff;
      border: 6px solid rgba(255,255,255,.45);
      box-shadow: inset 0 0 0 3px #000;
    }

    #shotBtn:active {
      transform: scale(.95);
    }

    #downloadLink {
      display: none;
    }

    .message {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #fff;
      text-align: center;
      background: #111;
      line-height: 1.7;
    }

    .message.hidden {
      display: none;
    }

    #flash {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
    }

    #flash.on {
      opacity: .9;
      transition: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="stage">
      <video id="camera" autoplay playsinline muted></video>
      <img id="frame" src="frame.png" alt="" />
      <div id="flash"></div>
    </div>

    <div class="ui">
      <button id="switchBtn" type="button" aria-label="カメラ切り替え">↺</button>
      <button id="shotBtn" type="button" aria-label="撮影"></button>
    </div>

    <a id="downloadLink"></a>

    <div id="message" class="message">
      カメラを起動しています。<br>
      初回はブラウザのカメラ使用を「許可」してください。
    </div>
  </main>

  <canvas id="canvas" hidden></canvas>

  <script>
    const video = document.getElementById("camera");
    const frame = document.getElementById("frame");
    const canvas = document.getElementById("canvas");
    const shotBtn = document.getElementById("shotBtn");
    const switchBtn = document.getElementById("switchBtn");
    const message = document.getElementById("message");
    const flash = document.getElementById("flash");
    const downloadLink = document.getElementById("downloadLink");

    let stream = null;
    let facingMode = "environment";

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        message.innerHTML = "このブラウザではカメラを利用できません。<br>Safari / Chromeで開いてください。";
        return;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.classList.toggle("mirror", facingMode === "user");
        await video.play();
        message.classList.add("hidden");
      } catch (err) {
        console.error(err);
        message.classList.remove("hidden");
        message.innerHTML =
          "カメラを起動できませんでした。<br>" +
          "ブラウザの設定でカメラを許可してください。<br><br>" +
          "※ HTTPSで公開されたページから開く必要があります。";
      }
    }

    switchBtn.addEventListener("click", async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      message.classList.remove("hidden");
      message.innerHTML = "カメラを切り替えています…";
      await startCamera();
    });

    shotBtn.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) return;

      flash.classList.add("on");
      setTimeout(() => flash.classList.remove("on"), 70);

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const screenRatio = window.innerWidth / window.innerHeight;
      const videoRatio = vw / vh;

      let sx = 0, sy = 0, sw = vw, sh = vh;

      if (videoRatio > screenRatio) {
        sw = vh * screenRatio;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / screenRatio;
        sy = (vh - sh) / 2;
      }

      canvas.width = Math.round(sw);
      canvas.height = Math.round(sh);

      const ctx = canvas.getContext("2d");

      if (facingMode === "user") {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      }

      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        if (!blob) return;

        const url = URL.createObjectURL(blob);
        const filename = `photo-${new Date().toISOString().replace(/[:.]/g, "-")}.png`;

        downloadLink.href = url;
        downloadLink.download = filename;
        downloadLink.click();

        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }, "image/png");
    });

    window.addEventListener("beforeunload", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    startCamera();
  </script>
</body>
</html>
